<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">AI4Control PMSM toolbox overview</title>
  <desc id="desc">Detailed workflow diagram for the AI4Control toolbox, showing the offline DPC data and training path, the controller wrapper interface, the common PMSM Simulink benchmark, and the metric and radar-chart evaluation path.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263445"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2268b8"/>
    </marker>
    <style>
      .page { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #c8d1dc; stroke-width: 2; rx: 14; }
      .lane { fill: #eef4fb; stroke: #cbd8e6; stroke-width: 1.5; rx: 12; }
      .title { font: 700 36px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 18px Arial, sans-serif; fill: #4b5563; }
      .lane-title { font: 700 20px Arial, sans-serif; fill: #27364a; letter-spacing: .2px; }
      .box-title { font: 700 22px Arial, sans-serif; fill: #111827; }
      .box-subtitle { font: 15px Arial, sans-serif; fill: #334155; }
      .body { font: 16px Arial, sans-serif; fill: #253142; }
      .small { font: 14px Arial, sans-serif; fill: #4b5563; }
      .tag { font: 700 13px Arial, sans-serif; fill: #1f2937; }
      .step { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .box { fill: #ffffff; stroke-width: 2.2; rx: 12; }
      .blue { stroke: #2f73c8; fill: #eaf3ff; }
      .green { stroke: #2f9461; fill: #eaf8f0; }
      .orange { stroke: #c47a21; fill: #fff1dd; }
      .red { stroke: #cf5d5d; fill: #fff0f0; }
      .gray { stroke: #64748b; fill: #f5f7fa; }
      .purple { stroke: #7c5cc4; fill: #f4efff; }
      .line { fill: none; stroke: #263445; stroke-width: 3; marker-end: url(#arrow-dark); }
      .line-blue { fill: none; stroke: #2268b8; stroke-width: 3; marker-end: url(#arrow-blue); }
      .line-dash { fill: none; stroke: #6b7280; stroke-width: 2.5; stroke-dasharray: 9 8; marker-end: url(#arrow-dark); }
      .divider { stroke: #d5dde8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1600" height="980"/>
  <rect class="panel" x="60" y="54" width="1480" height="870"/>

  <text class="title" x="100" y="115">AI4Control PMSM Toolbox Workflow</text>
  <text class="subtitle" x="102" y="151">A reusable MATLAB/Simulink benchmark for AI-assisted controller training, controller-wrapper integration, and normalized comparison.</text>

  <rect class="lane" x="100" y="190" width="1400" height="260"/>
  <text class="lane-title" x="125" y="226">Offline data and learning path</text>

  <rect class="lane" x="100" y="520" width="1400" height="320"/>
  <text class="lane-title" x="125" y="556">Closed-loop benchmark and evaluation path</text>

  <rect class="box blue" x="125" y="255" width="315" height="145"/>
  <circle cx="155" cy="286" r="18" fill="#2f73c8"/>
  <text class="step" x="149" y="293">1</text>
  <text class="box-title" x="185" y="292">MPC data generation</text>
  <text class="box-subtitle" x="185" y="319">Closed-loop PMSM simulations</text>
  <text class="body" x="150" y="352">- 5 speed levels: 300-1500 min^-1</text>
  <text class="body" x="150" y="378">- 5 load levels: 0-5 N*m</text>

  <rect class="box green" x="545" y="255" width="335" height="145"/>
  <circle cx="575" cy="286" r="18" fill="#2f9461"/>
  <text class="step" x="569" y="293">2</text>
  <text class="box-title" x="605" y="292">Training dataset</text>
  <text class="box-subtitle" x="605" y="319">Transient-rich DPC inputs</text>
  <text class="body" x="570" y="352">- Input vector: [id, iq, iqref, omega_e]</text>
  <text class="body" x="570" y="378">- 10,000 samples after downsampling</text>

  <rect class="box purple" x="985" y="255" width="360" height="145"/>
  <circle cx="1015" cy="286" r="18" fill="#7c5cc4"/>
  <text class="step" x="1009" y="293">3</text>
  <text class="box-title" x="1045" y="292">AI Control Trainer</text>
  <text class="box-subtitle" x="1045" y="319">apptrain.mlapp</text>
  <text class="body" x="1010" y="352">- Configure NN layers and hyperparameters</text>
  <text class="body" x="1010" y="378">- Train, validate, and export DPC policy</text>

  <path class="line-blue" d="M 440 327 L 545 327"/>
  <text class="small" x="466" y="309">trajectories</text>
  <path class="line-blue" d="M 880 327 L 985 327"/>
  <text class="small" x="905" y="309">training data</text>

  <rect class="box orange" x="125" y="590" width="350" height="165"/>
  <circle cx="155" cy="622" r="18" fill="#c47a21"/>
  <text class="step" x="149" y="629">4</text>
  <text class="box-title" x="185" y="628">Controller wrappers</text>
  <text class="box-subtitle" x="185" y="655">PI, MPC, DPC, or a new method</text>
  <text class="body" x="150" y="684">- Adapt dq, alpha-beta, abc,</text>
  <text class="body" x="150" y="710">  or switching signals</text>
  <text class="body" x="150" y="736">- Keep controller internals method-specific</text>

  <rect class="box red" x="600" y="575" width="405" height="195"/>
  <circle cx="630" cy="607" r="18" fill="#cf5d5d"/>
  <text class="step" x="624" y="614">5</text>
  <text class="box-title" x="660" y="613">Common PMSM benchmark</text>
  <text class="box-subtitle" x="660" y="640">PMSMcontrolbenchmark.slx</text>
  <text class="body" x="625" y="675">- PMSM plant, inverter, PWM, transformations</text>
  <text class="body" x="625" y="701">- Shared references and disturbance scenarios</text>
  <text class="body" x="625" y="727">- Common signal logging and benchmark timing</text>
  <text class="body" x="625" y="753">- Same environment for fair controller comparison</text>

  <rect class="box gray" x="1130" y="590" width="330" height="165"/>
  <circle cx="1160" cy="622" r="18" fill="#64748b"/>
  <text class="step" x="1154" y="629">6</text>
  <text class="box-title" x="1190" y="628">Metric extraction</text>
  <text class="box-subtitle" x="1190" y="655">calc_metrics_one_run.m</text>
  <text class="body" x="1155" y="688">- Overshoot and settling time</text>
  <text class="body" x="1155" y="714">- Phase-current THD</text>
  <text class="body" x="1155" y="740">- Robustness and execution-time scores</text>

  <rect class="box blue" x="600" y="805" width="445" height="95"/>
  <text class="box-title" x="625" y="848">Radar-chart comparison</text>
  <text class="body" x="625" y="875">draw_radar_from_workspace.m</text>
  <text class="body" x="625" y="897">normalizes all indicators to [0, 1]</text>

  <path class="line" d="M 475 672 L 600 672"/>
  <text class="small" x="500" y="653">voltage refs or switching commands</text>
  <path class="line" d="M 1005 672 L 1130 672"/>
  <text class="small" x="1042" y="653">logged outputs</text>
  <path class="line" d="M 1295 755 C 1295 858 1105 852 1045 852"/>
  <text class="small" x="1115" y="828">normalized scores</text>

  <path class="line-dash" d="M 1165 400 C 1155 500 965 532 825 575"/>
  <text class="small" x="940" y="500">trained DPC parameters</text>
  <path class="line-dash" d="M 805 805 C 735 788 620 770 475 730"/>
  <text class="small" x="510" y="798">iterate design after comparison</text>

  <line class="divider" x1="100" y1="475" x2="1500" y2="475"/>

  <rect x="113" y="862" width="360" height="35" rx="17" fill="#eef4fb" stroke="#cbd8e6"/>
  <text class="tag" x="137" y="885">Shared benchmark layer: plant + scenarios + logging + metrics</text>
  <rect x="1085" y="862" width="395" height="35" rx="17" fill="#fff1dd" stroke="#d9b06d"/>
  <text class="tag" x="1110" y="885">Controller-specific layer: wrapper + internal algorithm</text>
</svg>
